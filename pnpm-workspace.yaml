lockfile: true
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

packages:
  - packages/**
  - '!packages/module-app-sdk/dist'
  - .
  - apps/desktop
  - apps/desktop/src/main

minimumReleaseAgeExclude:
  - '@lobehub/*'

childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@lobehub/editor': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  core-js: false
  electron-winstaller: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  get-windows: true
  node-mac-permissions: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  '@hono/node-server': 1.19.14
  '@ant-design/icons': 6.3.2
  '@icons-pack/react-simple-icons': 13.13.0
  '@modelcontextprotocol/sdk': 1.29.0
  '@xmldom/xmldom@^0.8': 0.8.13
  '@xmldom/xmldom@^0.9': 0.9.10
  '@react-pdf/image': 3.0.4
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.0
  antd: 6.3.5
  baseline-browser-mapping: 2.10.31
  copy-anything: 4.0.5
  dingbat-to-unicode: 1.0.1
  drizzle-orm: 0.45.2
  eventsource-parser: 3.1.0
  fast-uri: 3.1.3
  fastq: 1.20.1
  fast-xml-parser: 5.4.2
  hono: 4.12.28
  ip-address: 10.2.0
  'ipaddr.js@^2': 2.4.0
  is-what: 5.5.0
  jose: ^6.1.3
  'js-yaml@^3': 3.15.0
