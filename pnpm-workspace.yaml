lockfile: true
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

packages:
  - packages/**
  - '!packages/module-app-sdk/dist'
  - .
  - apps/desktop
  - apps/desktop/src/main

minimumReleaseAgeExclude:
  - '@lobehub/*'

childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@lobehub/editor': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  core-js: false
  electron-winstaller: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  get-windows: true
  node-mac-permissions: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  '@ant-design/icons': 6.3.2
  '@react-pdf/image': 3.0.4
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.0
  antd: 6.3.5
  baseline-browser-mapping: 2.10.31
  drizzle-orm: ^0.45.2
  fast-xml-parser: 5.4.2
  jose: ^6.1.3
  lexical: 0.42.0
  node-gyp: ^12.4.0
  pdfjs-dist: 5.4.530
  react: 19.2.7
  react-dom: 19.2.7
  's3rver>fast-xml-parser': 3.21.1
  stylelint-config-clean-order: 7.0.0
  typescript: 6.0.3
  vitest: 5.0.0
  'zod@^4': 4.5.4
